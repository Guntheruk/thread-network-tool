name: Windows build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Native parser and core (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure read-only core and tests
        run: cmake -S . -B build/ci-native -G "Visual Studio 17 2022" -A x64 -DTNT_WITH_COMMISSIONER=OFF -DTNT_BUILD_TESTS=ON
      - name: Build Release
        run: cmake --build build/ci-native --config Release --parallel 2
      - name: Test Release
        run: ctest --test-dir build/ci-native -C Release --output-on-failure --timeout 60

  flutter-windows:
    name: Flutter Windows app build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build release Windows app
        run: flutter build windows --release
