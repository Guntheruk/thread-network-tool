name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Local tooling and protocol-driver tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build native journal fixtures for tooling tests
        run: |
          cmake -S . -B build/ci-tooling -DCMAKE_BUILD_TYPE=Release -DTNT_WITH_COMMISSIONER=OFF -DTNT_BUILD_TESTS=ON -DTNT_BUILD_MOVE_JOURNAL=ON
          cmake --build build/ci-tooling --target thread-move-journal tnt-move-journal-fault --parallel 2
      - name: Test notice collector and isolated lab driver
        env:
          TNT_JOURNAL_CLI: ${{ github.workspace }}/build/ci-tooling/thread-move-journal
          TNT_JOURNAL_FAULT: ${{ github.workspace }}/build/ci-tooling/tnt-move-journal-fault
        run: python3 -m unittest discover -s tests/tools -v

  native-core:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure read-only core and tests
        run: cmake -S . -B build/ci-native -DCMAKE_BUILD_TYPE=Release -DTNT_WITH_COMMISSIONER=OFF -DTNT_BUILD_TESTS=ON -DTNT_BUILD_MOVE_JOURNAL=ON
      - name: Build
        run: cmake --build build/ci-native --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-native --output-on-failure --timeout 60
      - name: Test durable journal with real processes
        env:
          TNT_JOURNAL_CLI: ${{ github.workspace }}/build/ci-native/thread-move-journal
          TNT_JOURNAL_FAULT: ${{ github.workspace }}/build/ci-native/tnt-move-journal-fault
        run: python3 -m unittest discover -s tests/tools -p test_move_journal.py -v

  flutter:
    name: Flutter analyze, test, and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test native session and loopback API contracts
        run: |
          dart run tool/network_move_plan_test.dart
          dart run tool/network_move_api_test.dart
          dart run tool/local_server_test.dart
      - name: Test execution and restart recovery with real journal
        run: |
          cmake -S .. -B ../build/ci-journal -DCMAKE_BUILD_TYPE=Release -DTNT_WITH_COMMISSIONER=OFF -DTNT_BUILD_TESTS=OFF -DTNT_BUILD_MOVE_JOURNAL=ON
          cmake --build ../build/ci-journal --target thread-move-journal --parallel 2
          dart run tool/move_execution_test.dart ../build/ci-journal/thread-move-journal
      - name: Build release web app
        run: flutter build web --release --no-web-resources-cdn
