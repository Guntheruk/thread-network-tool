name: iOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Test native request cancellation and deadline gate
        run: |
          xcrun swiftc app/ios/Runner/AppleCredentialRequest.swift tests/apple_credentials/main.swift -o "$RUNNER_TEMP/apple-request-test"
          "$RUNNER_TEMP/apple-request-test"
      - name: Build default unsigned Runner
        working-directory: app
        run: flutter build ios --debug --no-codesign
      - name: Compile enabled credential branch without granting access
        working-directory: app
        run: >-
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-enabled CODE_SIGNING_ALLOWED=NO
          'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG THREAD_CREDENTIALS_ENABLED'
          build
